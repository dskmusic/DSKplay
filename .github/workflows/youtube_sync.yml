name: YouTube sync & release

# Runs once a day to pick up fixes from the upstream Musify repo for the
# YouTube extraction files (the same ones update_youtube_libs.bat handles
# locally), reapplies our artist-catalog pagination patch, and only builds
# + releases a signed APK if that patch and the build both succeed.
#
# "Big change" (needs manual review) means exactly one of:
#   - the patch script couldn't find its anchor points in the new
#     music_client.dart, or
#   - the release build failed after updating the files.
# It is never based on how large the upstream diff is.
#
# workflow_dispatch offers two release modes (see the "release_mode" input):
#   - check_upstream: same as the scheduled run, but always cuts a release
#     even if upstream didn't change anything.
#   - direct: skips the upstream download/patch entirely and just builds +
#     releases the repository as it is right now.

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      release_mode:
        description: 'How to create the release'
        required: true
        type: choice
        default: check_upstream
        options:
          - check_upstream
          - direct

concurrency:
  group: youtube-sync
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

env:
  UPSTREAM_REPO: gokadzev/Musify
  MUSIC_CLIENT_PATH: packages/youtube_music_explode_dart/lib/src/music_client.dart

jobs:
  sync:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure failure-tracking label exists
        shell: pwsh
        run: |
          gh label create youtube-sync-failure --color b60205 --description "YouTube sync needs manual review" --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine release mode
        id: mode
        shell: pwsh
        run: |
          $mode = "check_upstream"
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $mode = "${{ inputs.release_mode }}"
          }
          Write-Host "Release mode: $mode"
          "mode=$mode" >> $env:GITHUB_OUTPUT

      - name: Download current upstream files
        id: download
        if: steps.mode.outputs.mode == 'check_upstream'
        shell: pwsh
        run: |
          $branch = try {
            (Invoke-RestMethod "https://api.github.com/repos/$env:UPSTREAM_REPO").default_branch
          } catch { $null }
          if ([string]::IsNullOrWhiteSpace($branch)) { $branch = "master" }
          Write-Host "Upstream default branch: $branch"
          $baseUrl = "https://raw.githubusercontent.com/$env:UPSTREAM_REPO/$branch"

          $files = @(
            "packages/youtube_explode_dart/lib/src/reverse_engineering/youtube_http_client.dart",
            "packages/youtube_explode_dart/lib/src/reverse_engineering/player/player_response.dart",
            "packages/youtube_explode_dart/lib/src/reverse_engineering/player/player_source.dart",
            "packages/youtube_explode_dart/lib/src/reverse_engineering/cipher/cipher_manifest.dart",
            "packages/youtube_explode_dart/lib/src/reverse_engineering/cipher/cipher_operations.dart",
            "packages/youtube_explode_dart/lib/src/reverse_engineering/challenges/js_challenge.dart",
            "packages/youtube_explode_dart/lib/src/reverse_engineering/challenges/ejs/base_ejs_solver.dart",
            "packages/youtube_explode_dart/lib/src/reverse_engineering/challenges/ejs/deno_ejs_solver.dart",
            "packages/youtube_explode_dart/lib/src/reverse_engineering/challenges/ejs/ejs.dart",
            "packages/youtube_explode_dart/lib/src/reverse_engineering/challenges/ejs/ejs_modules.g.dart",
            "packages/youtube_explode_dart/lib/src/reverse_engineering/pages/search_page.dart",
            "packages/youtube_explode_dart/lib/src/reverse_engineering/pages/watch_page.dart",
            "packages/youtube_explode_dart/lib/src/reverse_engineering/pages/playlist_page.dart",
            "packages/youtube_explode_dart/lib/src/reverse_engineering/pages/channel_page.dart",
            "packages/youtube_explode_dart/lib/src/reverse_engineering/pages/channel_upload_page.dart",
            "packages/youtube_explode_dart/lib/src/reverse_engineering/pages/channel_about_page.dart",
            "packages/youtube_explode_dart/lib/src/reverse_engineering/dash_manifest.dart",
            "packages/youtube_explode_dart/lib/src/reverse_engineering/hls_manifest.dart",
            "$env:MUSIC_CLIENT_PATH"
          )

          foreach ($f in $files) {
            Invoke-WebRequest -Uri "$baseUrl/$f" -OutFile $f -UseBasicParsing
          }

          $forced = "${{ github.event_name }}" -eq "workflow_dispatch"
          # NOTE: pass $files as an array, not a single -join'd string. PowerShell
          # only splats native-command args from an array; a joined string becomes
          # ONE pathspec argument (e.g. "a.dart b.dart c.dart") that matches no
          # real path, so `git diff --quiet` always reported "unchanged" here.
          git diff --quiet -- $files
          $hasDiff = $LASTEXITCODE -ne 0
          $changed = $forced -or $hasDiff

          Write-Host "Forced (manual trigger): $forced"
          Write-Host "Upstream files actually changed: $hasDiff"
          "changed=$changed" >> $env:GITHUB_OUTPUT
          "branch=$branch" >> $env:GITHUB_OUTPUT

      - name: Determine whether to build & release
        id: gate
        shell: pwsh
        run: |
          $mode = "${{ steps.mode.outputs.mode }}"
          $changed = "${{ steps.download.outputs.changed }}"
          $should = ($mode -eq 'direct') -or ($changed -eq 'true')
          Write-Host "Should build & release: $should"
          "should_release=$should" >> $env:GITHUB_OUTPUT

      - name: Reapply artist-catalog pagination patch
        id: patch
        if: steps.mode.outputs.mode == 'check_upstream' && steps.download.outputs.changed == 'true'
        shell: pwsh
        run: |
          .\patch_music_client.ps1 -FilePath "$env:MUSIC_CLIENT_PATH"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::The pagination patch could not be reapplied automatically - this needs manual review."
            exit 1
          }

      - name: Set up Java
        if: steps.gate.outputs.should_release == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        if: steps.gate.outputs.should_release == 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable

      - name: Configure release signing
        if: steps.gate.outputs.should_release == 'true'
        shell: pwsh
        run: |
          @"
          storePassword=$env:KEYSTORE_PASSWORD
          keyPassword=$env:KEY_PASSWORD
          keyAlias=$env:KEY_ALIAS
          "@ | Set-Content -Path android/key.properties -NoNewline

          $bytes = [Convert]::FromBase64String($env:KEYSTORE_BASE64)
          [IO.File]::WriteAllBytes("android/app/key.jks", $bytes)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: flutter pub get
        if: steps.gate.outputs.should_release == 'true'
        run: flutter pub get

      - name: Compute release tag
        id: tag
        if: steps.gate.outputs.should_release == 'true'
        shell: pwsh
        run: |
          $date = Get-Date -Format "yyyy.MM.dd"
          $prefix = if ("${{ steps.mode.outputs.mode }}" -eq 'direct') { 'release' } else { 'auto-sync' }
          "tag=$prefix-$date-${{ github.run_number }}" >> $env:GITHUB_OUTPUT

      - name: Bump build number
        id: bump
        if: steps.gate.outputs.should_release == 'true'
        shell: pwsh
        run: |
          $pubspec = Get-Content pubspec.yaml -Raw
          if ($pubspec -match 'version:\s*([\d.]+)\+(\d+)') {
            $verNum = $matches[1]
            $build = [int]$matches[2] + 1
            $pubspec = $pubspec -replace 'version:\s*[\d.]+\+\d+', "version: $verNum+$build"
            Set-Content -Path pubspec.yaml -Value $pubspec -NoNewline
            Set-Content -Path lib/constants/version.dart -Value "const appVersion = '$verNum';`nconst appBuildNumber = '$build';" -NoNewline
            "verNum=$verNum" >> $env:GITHUB_OUTPUT
            "build=$build" >> $env:GITHUB_OUTPUT
          }

      - name: Build signed release APK
        id: build
        if: steps.gate.outputs.should_release == 'true'
        shell: pwsh
        run: |
          flutter build apk --release
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Release build failed after updating the YouTube extraction files - this needs manual review."
            exit 1
          }

      - name: Commit synced files
        if: steps.gate.outputs.should_release == 'true' && steps.build.outcome == 'success'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/youtube_explode_dart packages/youtube_music_explode_dart pubspec.yaml lib/constants/version.dart
          git diff --staged --quiet
          if ($LASTEXITCODE -ne 0) {
            if ("${{ steps.mode.outputs.mode }}" -eq 'check_upstream' -and "${{ steps.download.outputs.changed }}" -eq 'true') {
              git commit -m "chore: sync YouTube extraction fixes from upstream Musify (auto)"
            } else {
              git commit -m "chore: bump build number to ${{ steps.bump.outputs.build }} (manual release)"
            }
            git push
          } else {
            Write-Host "Nothing to commit."
          }

      - name: Publish release
        if: steps.gate.outputs.should_release == 'true' && steps.build.outcome == 'success'
        shell: pwsh
        run: |
          $tag = "${{ steps.tag.outputs.tag }}"
          $verNum = "${{ steps.bump.outputs.verNum }}"
          $build = "${{ steps.bump.outputs.build }}"
          $mode = "${{ steps.mode.outputs.mode }}"
          $upstreamChanged = "${{ steps.download.outputs.changed }}" -eq 'true'

          if ($mode -eq 'check_upstream' -and $upstreamChanged) {
            $notes = @"
          Automatic sync of YouTube extraction files from upstream Musify (branch: ${{ steps.download.outputs.branch }}), pagination patch reapplied and rebuilt successfully.

          BuildNumber: $build
          "@
          } elseif ($mode -eq 'check_upstream') {
            $notes = @"
          Manual release cut on demand. Upstream Musify was checked (branch: ${{ steps.download.outputs.branch }}) but had no relevant changes, so this build is the current repository as-is.

          BuildNumber: $build
          "@
          } else {
            $notes = @"
          Manual release built directly from the current repository state, without checking upstream Musify.

          BuildNumber: $build
          "@
          }
          gh release create $tag `
            "build/app/outputs/flutter-apk/app-release.apk" `
            --title "DSK Play v$verNum (build $build)" `
            --notes $notes

          # A previous failure is no longer relevant once a sync succeeds.
          $openIssue = gh issue list --label youtube-sync-failure --state open --json number --jq '.[0].number'
          if ($openIssue) {
            gh issue comment $openIssue --body "Resolved by a successful sync: $tag"
            gh issue close $openIssue
          }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report failure loudly
        if: failure()
        shell: pwsh
        run: |
          $body = @"
          The automatic YouTube sync found upstream changes but could **not** finish safely, so nothing was built or released.

          - Patch step: ${{ steps.patch.outcome }}
          - Build step: ${{ steps.build.outcome }}
          - Upstream branch checked: ${{ steps.download.outputs.branch }}
          - Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          This means the upstream files changed enough that simply replacing them and reapplying the pagination patch didn't work. **Needs manual review.**
          "@

          $existing = gh issue list --label youtube-sync-failure --state open --json number --jq '.[0].number'
          if ($existing) {
            gh issue comment $existing --body $body
          } else {
            gh issue create --title "YouTube sync needs manual review" --label youtube-sync-failure --body $body
          }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
